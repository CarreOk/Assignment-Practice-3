    <script>
        function timesTable(number) {document.write("<h3> Times Table for " + number + "</h3>");
        for (let i = 1; i <= 12; i++)   {
            document.write(number + " x " + i + " = " + number * i + "<br>");}
            //this funtion will print the times table for the number that is passed in as an argument. It will print the times table from 1 to 12.
} 

//this code will prompt the user to enter a number and then it will call the timesTable function with the user's input as an argument. It will also print a message to the user after they have entered their input.
  let user = prompt("Try out some mathing!!!");
  if (user != null) {
            timesTable(user);
    document.write("<p>Hope you had fun. " + user + "! Whats Next?</p>");

        // Function to convert Fahrenheit to Celsius
  function fahr2cels(valNum) {
  valNum = parseFloat(valNum);
  document.getElementById("outputCelcius").innerHTML=(valNum-32)/1.8;
}//this function will take a value in Fahrenheit and convert it to Celsius. It will also update the innerHTML of an element with the id "outputCelcius" to display the result.
 let far = 32;
 let cel = (far - 32) / 1.8;
 let kelv = cel + 273.15;
 //this code will convert 32°F to Celsius and Kelvin. It will then print the results to the console and also write them to the document.

console.log(far + "°F is " + cel + "°C and " + kelv + "K");
document.write("<h3>Farenheit to Celcius Conversions</h3>");

document.write(far + "°F is " + fahr2cels(far) + "°C<br>");

   //this code will print the results of the Fahrenheit to Celsius conversion to the console and also write them to the document. It will also convert 32°F to Celsius and write the result to the document. It will also convert the Celsius value back to Fahrenheit and write the result to the document. Finally, it will convert the Kelvin value back to Celsius and write the result to the document.
